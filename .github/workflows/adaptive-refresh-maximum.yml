name: Adaptive maximum series validation
'on':
  push:
    branches: [codex/held-series-ci-20261019]
    paths:
      - '.github/adaptive-refresh/maximum.py'
      - '.github/workflows/adaptive-refresh-maximum.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: adaptive-maximum-validation
  cancel-in-progress: true
jobs:
  wait-for-bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Wait for the bounded source preparation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.request
          url = ("https://api.github.com/repos/OllieinCanada/"
                 "sashiko/actions/runs/39370749173")
          deadline = time.monotonic() + 1200
          while True:
              request = urllib.request.Request(url, headers={
                  "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                  "Accept": "application/vnd.github+json",
              })
              with urllib.request.urlopen(request, timeout=20) as response:
                  run = json.load(response)
              if run["head_sha"] != (
                      "c6e85fccb1e25e19237de8e8fe252dab8fb66bc7"):
                  raise RuntimeError("unexpected preparation checkpoint")
              if run["status"] == "completed":
                  print("Preparation completed: " + str(run["conclusion"]))
                  if run["conclusion"] != "success":
                      raise RuntimeError("native optimization did not pass")
                  break
              if time.monotonic() >= deadline:
                  raise RuntimeError("bounded preparation wait exceeded")
              print("Preparation still running", flush=True)
              time.sleep(15)
          PY
  refresh:
    needs: wait-for-bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RUSTUP_TOOLCHAIN: stable
      CARGO_BUILD_JOBS: 2
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify clean starting checkout
        run: test -z "$(git status --porcelain)"
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 39370749173
          name: adaptive-message-cost-c6e85fccb1e25e19237de8e8fe252dab8fb66bc7
          path: input-refresh
      - run: >-
          rustup toolchain install stable --profile minimal
          --component rustfmt --component clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Check audit harness
        run: |
          if pgrep -x sashiko; then
            exit 1
          fi
          python3 -m venv /tmp/adaptive-refresh-lint
          /tmp/adaptive-refresh-lint/bin/pip install yamllint==1.37.1
          export PATH="/tmp/adaptive-refresh-lint/bin:$PATH"
          make check-pr RANGE=HEAD~1..HEAD
          python3 - <<'PY'
          import ast
          from pathlib import Path
          ast.parse(Path(".github/adaptive-refresh/maximum.py").read_text())
          PY
      - name: Validate maximum series and crash-safe replay
        run: |
          export PATH="/tmp/adaptive-refresh-lint/bin:$PATH"
          python3 .github/adaptive-refresh/maximum.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: adaptive-maximum-${{ github.sha }}
          path: maximum-results/
          retention-days: 14
          if-no-files-found: warn
