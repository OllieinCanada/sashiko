name: Adaptive focused mutation controls

'on':
  push:
    branches: [codex/held-series-ci-20261019]
    paths:
      - '.github/adaptive-mutation-validation/**'
      - '.github/workflows/adaptive-mutations.yml'
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semantic-mutants:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      RUSTUP_TOOLCHAIN: stable
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Verify isolated runner
        run: |
          if pgrep -x sashiko; then
            exit 1
          fi
      - name: Focused semantic mutations
        timeout-minutes: 22
        run: python3 .github/adaptive-mutation-validation/run.py
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adaptive-mutation-evidence-${{ github.sha }}
          path: |
            adaptive-mutation-results/manifest.json
            adaptive-mutation-results/*.log
          retention-days: 14
          if-no-files-found: error
