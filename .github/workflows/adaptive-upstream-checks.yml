name: Adaptive exact upstream toolchain comparison
'on':
  push:
    branches: [codex/held-series-ci-20261019]
    paths: ['.github/workflows/adaptive-upstream-checks.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  upstream-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        toolchain: ['1.90.0', 'stable']
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.toolchain }}
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: rustup toolchain install "${{ matrix.toolchain }}" --profile minimal --component rustfmt --component clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          key: upstream-${{ matrix.toolchain }}
      - name: Check untouched upstream
        run: |
          git worktree add --detach "$RUNNER_TEMP/upstream-baseline" 7f92f869a960a20f7d395550b4879d897ebdf4ea
          mkdir -p upstream-check-results
          export CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target"
          rustc --version > upstream-check-results/environment.txt
          cargo --version >> upstream-check-results/environment.txt
          cd "$RUNNER_TEMP/upstream-baseline"
          set +e
          make check-pr RANGE=7f92f869a960a20f7d395550b4879d897ebdf4ea..HEAD > "$GITHUB_WORKSPACE/upstream-check-results/check-pr.log" 2>&1
          check_status=$?
          cargo test --locked --all-features > "$GITHUB_WORKSPACE/upstream-check-results/tests.log" 2>&1
          test_status=$?
          printf 'check_pr=%s\ntests=%s\n' "$check_status" "$test_status" > "$GITHUB_WORKSPACE/upstream-check-results/status.txt"
          tail -100 "$GITHUB_WORKSPACE/upstream-check-results/check-pr.log"
          tail -50 "$GITHUB_WORKSPACE/upstream-check-results/tests.log"
          if [ "$check_status" -ne 0 ] || [ "$test_status" -ne 0 ]; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: adaptive-upstream-${{ matrix.toolchain }}-${{ github.sha }}
          path: upstream-check-results/
