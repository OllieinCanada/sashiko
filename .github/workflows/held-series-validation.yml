name: Held series native validation

on:
  push:
    branches: [codex/prerequisite-ci-frozen]

permissions:
  contents: read

concurrency:
  group: held-series-${{ github.ref }}
  cancel-in-progress: false

jobs:
  formatting:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install pinned formatter
        run: rustup toolchain install 1.90.0 --profile minimal --component rustfmt
      - name: Check formatting and emit repair diff
        run: |
          set +e
          cargo +1.90.0 fmt --all -- --check > /tmp/format-check.log 2>&1
          result=$?
          cat /tmp/format-check.log
          if [ "$result" -ne 0 ]; then
            cargo +1.90.0 fmt --all
            git diff -- src
          fi
          exit "$result"
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      RUSTUP_TOOLCHAIN: 1.90.0
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned toolchain
        run: rustup toolchain install 1.90.0 --profile minimal
      - name: Resolve target cache path
        id: target-cache
        run: |
          python3 - <<'PYTHON' >> "$GITHUB_OUTPUT"
          import os
          target = os.path.join(os.environ["RUNNER_TEMP"], "held-series-validation", "target")
          print("path=" + os.path.relpath(target, os.environ["GITHUB_WORKSPACE"]))
          PYTHON
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> ${{ steps.target-cache.outputs.path }}
          cache-on-failure: true
      - name: Validate runner classification
        run: python3 .github/scripts/held_series_validation.py --self-check
      - name: Run baseline and candidate regressions
        run: >-
          python3 .github/scripts/held_series_validation.py
          --allow-dependency-downloads
      - name: Include diagnostic tails in job log
        if: always()
        run: |
          find "$RUNNER_TEMP/held-series-validation/evidence/native-runs" \
            -name '*.log' -type f -exec tail -n 100 {} +
          find "$RUNNER_TEMP/held-series-validation/evidence/native-runs" \
            -name manifest.json -type f -exec cat {} +
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: held-series-${{ github.sha }}
          path: ${{ runner.temp }}/held-series-validation/evidence/
          retention-days: 7

  source-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RUSTUP_TOOLCHAIN: stable
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install upstream CI toolchain
        run: >-
          rustup toolchain install stable --profile minimal
          --component rustfmt --component clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Toolchain identity
        run: |
          rustc --version
          cargo --version
          git rev-parse HEAD
      - name: Format candidate for compilation diagnostics
        run: cargo fmt --all
      - name: YAML lint
        run: |
          if ! command -v yamllint >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends yamllint
          fi
          yamllint .
      - name: Clippy all features
        if: always()
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Clippy local profile
        run: cargo clippy --locked --all-targets --no-default-features -- -D warnings
      - name: Clippy local cache profile
        run: >-
          cargo clippy --locked --all-targets --no-default-features
          --features cache -- -D warnings
      - name: Full tests
        if: always()
        run: cargo test --locked --all-features
