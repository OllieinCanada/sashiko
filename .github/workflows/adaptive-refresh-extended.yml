name: Adaptive remaining validation
'on':
  push:
    branches: [codex/held-series-ci-20261019]
    paths:
      - '.github/adaptive-refresh/extended.py'
      - '.github/adaptive-refresh/process_fixture.rs'
      - '.github/adaptive-refresh/rollback_candidate.rs'
      - '.github/adaptive-refresh/rollback_old.rs'
      - '.github/workflows/adaptive-refresh-extended.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: adaptive-remaining-validation
  cancel-in-progress: true
jobs:
  wait-for-bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Wait for the bounded source preparation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.request
          url = ("https://api.github.com/repos/OllieinCanada/"
                 "sashiko/actions/runs/39367721490")
          deadline = time.monotonic() + 1200
          while True:
              request = urllib.request.Request(url, headers={
                  "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                  "Accept": "application/vnd.github+json",
              })
              with urllib.request.urlopen(request, timeout=20) as response:
                  run = json.load(response)
              if run["head_sha"] != (
                      "5839f5285c9940af3f2cd4e74b97f51119fffdf1"):
                  raise RuntimeError("unexpected preparation checkpoint")
              if run["status"] == "completed":
                  print("Preparation completed: " + str(run["conclusion"]))
                  if run["conclusion"] != "success":
                      raise RuntimeError("native optimization did not pass")
                  break
              if time.monotonic() >= deadline:
                  raise RuntimeError("bounded preparation wait exceeded")
              print("Preparation still running", flush=True)
              time.sleep(15)
          PY
  extended:
    needs: wait-for-bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        phase:
          - performance
          - deterministic
          - rollback
          - crash
          - conflict
          - clock
          - historical
          - cancel
          - concurrency
          - faults
          - upstream
    env:
      RUSTUP_TOOLCHAIN: stable
      CARGO_BUILD_JOBS: 2
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify clean starting checkout
        run: test -z "$(git status --porcelain)"
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 39367721490
          name: adaptive-optimized-5839f5285c9940af3f2cd4e74b97f51119fffdf1
          path: input-refresh
      - run: >-
          rustup toolchain install stable --profile minimal
          --component rustfmt --component clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Check audit harness
        run: |
          if pgrep -x sashiko; then
            exit 1
          fi
          python3 -m venv /tmp/adaptive-extended-lint
          /tmp/adaptive-extended-lint/bin/pip install yamllint==1.37.1
          export PATH="/tmp/adaptive-extended-lint/bin:$PATH"
          make check-pr RANGE=HEAD~1..HEAD
          python3 - <<'PY'
          import ast
          from pathlib import Path
          ast.parse(Path(".github/adaptive-refresh/extended.py").read_text())
          PY
      - name: Run scoped native validation
        run: >-
          python3 .github/adaptive-refresh/extended.py
          ${{ matrix.phase }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: adaptive-extended-${{ matrix.phase }}-${{ github.sha }}
          path: |
            extended-results/*.json
            extended-results/*.log
          retention-days: 14
          if-no-files-found: warn
