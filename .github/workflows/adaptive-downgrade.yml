name: Adaptive old-version access rehearsal

'on':
  push:
    branches: [codex/held-series-ci-20261019]
    paths:
      - '.github/adaptive-downgrade/**'
      - '.github/workflows/adaptive-downgrade.yml'
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  old-version-rehearsal:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      RUSTUP_TOOLCHAIN: stable
      CARGO_BUILD_JOBS: 2
      CARGO_NET_RETRY: 0
      CARGO_HTTP_TIMEOUT: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: >-
          rustup toolchain install stable --profile minimal
          --component rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          shared-key: native-validation
      - name: Verify isolated runner
        run: |
          if pgrep -x sashiko; then
            exit 1
          fi
          python3 - <<'PY'
          import ast
          from pathlib import Path
          ast.parse(Path(".github/adaptive-downgrade/run.py").read_text())
          PY
      - name: Quiesce and reopen with native old-version code
        timeout-minutes: 37
        run: python3 .github/adaptive-downgrade/run.py
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adaptive-downgrade-${{ github.sha }}
          path: |
            adaptive-downgrade-results/manifest.json
            adaptive-downgrade-results/*.log
          retention-days: 14
          if-no-files-found: error
