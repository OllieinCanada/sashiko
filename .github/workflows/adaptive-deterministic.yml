name: Adaptive deterministic coverage expansion

'on':
  push:
    branches: [codex/held-series-ci-20261019]
    paths:
      - '.github/adaptive-deterministic/**'
      - '.github/workflows/adaptive-deterministic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-gaps:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: stable
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check fork checkpoint and isolated runner
        run: |
          if pgrep -x sashiko; then
            exit 1
          fi
          python3 -m venv /tmp/adaptive-deterministic-lint
          /tmp/adaptive-deterministic-lint/bin/pip install yamllint==1.37.1
          export PATH="/tmp/adaptive-deterministic-lint/bin:$PATH"
          make check-pr RANGE=2849e47b23f74c7c2f68011325512c1337a38525..HEAD
          python3 -m py_compile .github/adaptive-deterministic/run.py
          df -h .
      - run: >-
          rustup toolchain install stable --profile minimal
          --component rustfmt --component clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Run bounded native coverage and negative controls
        run: python3 .github/adaptive-deterministic/run.py
      - name: Upload reproducible evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adaptive-deterministic-${{ github.sha }}
          path: adaptive-deterministic-results/
          retention-days: 14
          if-no-files-found: warn
