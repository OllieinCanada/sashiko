name: Adaptive deterministic coverage expansion

'on':
  push:
    branches: [codex/held-series-ci-20261019]
    paths:
      - '.github/adaptive-deterministic/**'
      - '.github/workflows/adaptive-deterministic.yml'
      - '.github/adaptive-review-cancel/**'
      - '.github/workflows/adaptive-review-cancel.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: adaptive-deterministic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused-gaps:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RUSTUP_TOOLCHAIN: stable
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: >-
          rustup toolchain install stable --profile minimal
          --component rustfmt --component clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Check fork checkpoint and isolated runner
        id: preflight
        run: |
          if pgrep -x sashiko; then
            exit 1
          fi
          python3 -m venv /tmp/adaptive-deterministic-lint
          /tmp/adaptive-deterministic-lint/bin/pip install yamllint==1.37.1
          export PATH="/tmp/adaptive-deterministic-lint/bin:$PATH"
          make sob RANGE=HEAD~1..HEAD
          yamllint .
          python3 -m py_compile .github/adaptive-deterministic/run.py
          df -h .
          if git diff --name-only HEAD~1 HEAD |
            rg -q '^src/|^Cargo\.|^\.github/adaptive-review-cancel/'; then
            echo "review_cancel=true" >> "$GITHUB_OUTPUT"
          else
            echo "review_cancel=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Run bounded native coverage and semantic controls
        id: coverage
        run: python3 .github/adaptive-deterministic/run.py
      - name: Validate active-review cancellation and semantic controls
        if: >-
          ${{ !cancelled() &&
          (github.event_name == 'workflow_dispatch' ||
          steps.preflight.outputs.review_cancel == 'true') }}
        run: python3 .github/adaptive-review-cancel/run.py
      - name: Check restored checkout once
        if: ${{ !cancelled() }}
        run: |
          export PATH="/tmp/adaptive-deterministic-lint/bin:$PATH"
          make check-pr RANGE=HEAD~1..HEAD
      - name: Upload cancellation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adaptive-review-cancel-${{ github.sha }}
          path: adaptive-review-cancel-results/
          retention-days: 14
          if-no-files-found: warn
      - name: Upload reproducible evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adaptive-deterministic-${{ github.sha }}
          path: adaptive-deterministic-results/
          retention-days: 14
          if-no-files-found: warn
