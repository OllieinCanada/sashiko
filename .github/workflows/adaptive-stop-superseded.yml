name: Stop obsolete adaptive rollback fixture
'on':
  push:
    branches: [codex/held-series-ci-20261019]
    paths: ['.github/workflows/adaptive-stop-superseded.yml']
permissions:
  contents: read
  actions: write
jobs:
  stop:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Cancel one obsolete fixture and preserve always-uploaded evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request
          base = ("https://api.github.com/repos/OllieinCanada/"
                  "sashiko/actions/runs/39359678639")
          headers = {
              "Authorization": "Bearer " + os.environ["GH_TOKEN"],
              "Accept": "application/vnd.github+json",
          }
          request = urllib.request.Request(base, headers=headers)
          with urllib.request.urlopen(request, timeout=20) as response:
              run = json.load(response)
          if run["head_sha"] != (
                  "d0c94f96a95b186a5a50f1d9127c43b5a4392b32"):
              raise RuntimeError("unexpected source checkpoint")
          if run["head_branch"] != "codex/held-series-ci-20261019":
              raise RuntimeError("unexpected branch")
          if run["status"] != "completed":
              request = urllib.request.Request(
                  base + "/cancel", data=b"", headers=headers, method="POST")
              with urllib.request.urlopen(request, timeout=20) as response:
                  print(json.dumps({"id": run["id"],
                                    "normal_cancel": response.status,
                                    "preserve_always_upload": True}))
          else:
              print(json.dumps({"id": run["id"],
                                "completed": run["conclusion"]}))
          PY
