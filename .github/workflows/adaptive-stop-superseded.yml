name: Stop superseded adaptive validation runs
'on':
  push:
    branches: [codex/held-series-ci-20261019]
    paths: ['.github/workflows/adaptive-stop-superseded.yml']
permissions:
  actions: write
  contents: read
jobs:
  stop-superseded:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Stop the diagnosed failed run only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          base = "https://api.github.com/repos/OllieinCanada/sashiko"
          target = base + "/actions/runs/39333144037"
          headers = {
              "Authorization": "Bearer " + os.environ["GH_TOKEN"],
              "Accept": "application/vnd.github+json",
          }
          request = urllib.request.Request(target, headers=headers)
          with urllib.request.urlopen(request, timeout=20) as response:
              run = json.load(response)
          if run["status"] != "completed":
              assert run["head_sha"] == "ed081ca81391a7745684bec31b2245c6b8eed0ae"
              request = urllib.request.Request(
                  target + "/force-cancel", headers=headers,
                  data=b"", method="POST")
              with urllib.request.urlopen(request, timeout=20) as response:
                  print("Scoped force cancellation:", response.status)
          else:
              print("Already complete:", run["conclusion"])
          PY
