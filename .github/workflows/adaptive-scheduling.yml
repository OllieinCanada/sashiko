name: Adaptive expiry and worker restart

'on':
  push:
    branches: [codex/held-series-ci-20261019]
    paths:
      - '.github/adaptive-scheduling/**'
      - '.github/adaptive-observability/instrument.py'
      - '.github/workflows/adaptive-scheduling.yml'
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  restart-scheduling:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RUSTUP_TOOLCHAIN: stable
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: >-
          rustup toolchain install stable --profile minimal
          --component rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Verify isolated runner
        run: |
          if pgrep -x sashiko; then
            exit 1
          fi
      - name: Natural expiry, restarted workers and slow recording transport
        timeout-minutes: 12
        run: python3 .github/adaptive-scheduling/run.py
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adaptive-scheduling-${{ github.sha }}
          path: |
            adaptive-scheduling-results/manifest.json
            adaptive-scheduling-results/*.log
          retention-days: 14
          if-no-files-found: error
