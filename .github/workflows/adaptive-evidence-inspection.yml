name: Inspect final adaptive evidence

'on':
  push:
    branches: [codex/held-series-ci-20261019]
    paths:
      - '.github/adaptive-evidence-inspection/**'
      - '.github/workflows/adaptive-evidence-inspection.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  inspect-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check fork evidence changes
        run: |
          python3 -m venv /tmp/adaptive-evidence-lint
          /tmp/adaptive-evidence-lint/bin/pip install yamllint==1.37.1
          export PATH="/tmp/adaptive-evidence-lint/bin:$PATH"
          make check-pr RANGE=HEAD~1..HEAD
          yamllint .github/workflows/adaptive-evidence-inspection.yml
      - uses: actions/download-artifact@v4
        with:
          name: >-
            adaptive-source-preparation-010274b4d10a4db39cb7de2bcef0108a92bdc82b
          run-id: 39330032302
          github-token: ${{ github.token }}
          path: evidence-input/source
      - uses: actions/download-artifact@v4
        with:
          name: >-
            adaptive-mutation-evidence-bd59059f1864aea81b11b5de0eb97e5d2ec53667
          run-id: 39320285657
          github-token: ${{ github.token }}
          path: evidence-input/mutation
      - uses: actions/download-artifact@v4
        with:
          name: >-
            adaptive-deterministic-d9cc305c8e000add224b93800d21e3edcefc8f11
          run-id: 39333925430
          github-token: ${{ github.token }}
          path: evidence-input/focused
      - uses: actions/download-artifact@v4
        with:
          name: >-
            adaptive-review-cancel-ee43b24b8c3b246eb9c81d343cdfa4d607729d29
          run-id: 39332466758
          github-token: ${{ github.token }}
          path: evidence-input/cancellation
      - uses: actions/download-artifact@v4
        with:
          name: >-
            bounded-model-review-eeb55429744b5f097534d3627375cfc3a1c828a3
          run-id: 39336060768
          github-token: ${{ github.token }}
          path: evidence-input/model
      - name: Inspect bounded review outcome without provider calls
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path("evidence-input/model")
          manifest = json.loads((root / "manifest.json").read_text())
          safe = {k: manifest.get(k) for k in (
              "status", "model", "error", "last_error", "agent_status",
              "reserved_usd", "calls", "head", "base", "maximum_usd_this_attempt")}
          agent = root / "agent.json"
          if agent.exists():
              try:
                  data = json.loads(agent.read_text())
                  safe["agent"] = {k: data.get(k) for k in (
                      "status", "error", "partial", "findings", "concerns")}
              except json.JSONDecodeError:
                  safe["agent_json_valid"] = False
          Path("adaptive-model-diagnosis.json").write_text(
              json.dumps(safe, indent=2) + "\n")
          print(json.dumps(safe, indent=2))
          PY
      - uses: actions/download-artifact@v4
        with:
          name: >-
            adaptive-downgrade-dd35160017569ff9516006d36d45310f6a6a585c
          run-id: 39336822289
          github-token: ${{ github.token }}
          path: evidence-input/operational
      - name: Read failed daemon startup diagnostics only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path("evidence-input/operational")
          print((root / "manifest.json").read_text())
          print((root / "candidate-before-stop-daemon.log").read_text()[-8000:])
          PY
      - name: Verify bundle and semantic failure evidence
        run: python3 .github/adaptive-evidence-inspection/run.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: adaptive-evidence-inspection-${{ github.sha }}
          path: |
            adaptive-evidence-inspection.json
            adaptive-model-diagnosis.json
          retention-days: 14
          if-no-files-found: warn
