name: Adaptive public historical shadow replay
'on':
  push:
    branches: [codex/held-series-ci-20261019]
    paths: ['.github/adaptive-historical/**', '.github/workflows/adaptive-historical.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  historical-shadow:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      RUSTUP_TOOLCHAIN: stable
      CARGO_BUILD_JOBS: 2
      HISTORICAL_ARCHIVE_FETCH: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal --component rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          shared-key: native-validation
      - name: Verify isolated runner
        run: |
          if pgrep -x sashiko; then exit 1; fi
      - name: Public archive replay into a protected shadow
        timeout-minutes: 14
        run: python3 .github/adaptive-historical/run.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: adaptive-historical-${{ github.sha }}
          path: adaptive-historical-results/
          retention-days: 14
          if-no-files-found: error
