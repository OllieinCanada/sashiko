name: Bounded conflict native candidate
'on':
  push:
    branches: [codex/held-series-ci-20261019]
    paths:
      - '.github/adaptive-conflict/candidate.json'
      - '.github/adaptive-conflict/native.py'
      - '.github/workflows/adaptive-conflict-native.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: adaptive-conflict-native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  focused-gaps:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      RUSTUP_TOOLCHAIN: stable
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: >-
          rustup toolchain install stable --profile minimal
          --component rustfmt --component clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Prepare isolated checks
        run: |
          if pgrep -x sashiko; then
            exit 1
          fi
          python3 -m venv /tmp/adaptive-conflict-native-lint
          /tmp/adaptive-conflict-native-lint/bin/pip install yamllint==1.37.1
          export PATH="/tmp/adaptive-conflict-native-lint/bin:$PATH"
          make check-pr RANGE=HEAD~1..HEAD
          python3 - <<'PY'
          import ast
          from pathlib import Path
          ast.parse(Path(".github/adaptive-conflict/native.py").read_text())
          PY
      - name: Validate native candidate before committing source
        run: |
          export PATH="/tmp/adaptive-conflict-native-lint/bin:$PATH"
          python3 .github/adaptive-conflict/native.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: adaptive-conflict-native-${{ github.sha }}
          path: adaptive-conflict-native-results/
          retention-days: 14
          if-no-files-found: warn
