name: Adaptive cooldown validation

'on':
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: adaptive-cooldown-${{ github.ref }}
  cancel-in-progress: false

jobs:
  formatting:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal --component rustfmt
      - name: Formatting
        run: |
          set +e
          cargo fmt --all -- --check
          result=$?
          if [ "$result" -ne 0 ]; then
            cargo fmt --all
            git diff -- src
          fi
          exit "$result"
  source-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RUSTUP_TOOLCHAIN: stable
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Toolchain
        run: >-
          rustup toolchain install stable --profile minimal
          --component rustfmt --component clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Format for compiler diagnostics
        run: cargo fmt --all
      - name: Clippy all features
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Clippy local profile
        if: always()
        run: cargo clippy --locked --all-targets --no-default-features -- -D warnings
      - name: Clippy cache profile
        if: always()
        run: >-
          cargo clippy --locked --all-targets --no-default-features
          --features cache -- -D warnings
      - name: Full tests
        if: always()
        run: cargo test --locked --all-features
