name: Adaptive cooldown validation

'on':
  push:
    branches: [codex/held-series-ci-20261019]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: adaptive-cooldown-${{ github.ref }}
  cancel-in-progress: false

jobs:
  formatting:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal --component rustfmt
      - name: Formatting
        run: |
          set +e
          cargo fmt --all -- --check
          result=$?
          if [ "$result" -ne 0 ]; then
            cargo fmt --all
            git diff -- src
          fi
          exit "$result"
  source-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RUSTUP_TOOLCHAIN: stable
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Toolchain
        run: >-
          rustup toolchain install stable --profile minimal
          --component rustfmt --component clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Format for compiler diagnostics
        run: cargo fmt --all
      - name: Clippy all features
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Clippy local profile
        if: always()
        run: cargo clippy --locked --all-targets --no-default-features -- -D warnings
      - name: Clippy cache profile
        if: always()
        run: >-
          cargo clippy --locked --all-targets --no-default-features
          --features cache -- -D warnings
      - name: Full tests
        if: always()
        run: cargo test --locked --all-features
      - name: Prepare bounded offline native tooling
        if: always()
        run: |
          set -eu
          sdk_root=$(dirname "$(dirname "$(rustup which rustc)")")
          bundle="$RUNNER_TEMP/native-tooling/stage"
          mkdir -p "$bundle/cargo"
          ln -s "$sdk_root" "$bundle/sdk"
          ln -s "$HOME/.cargo/registry" "$bundle/cargo/registry"
          rustc -vV > "$bundle/identity.txt"
          cargo --version >> "$bundle/identity.txt"
          tar -h -czf "$RUNNER_TEMP/native-tooling/tooling.tar.gz" \
            -C "$bundle" sdk cargo/registry/cache cargo/registry/index identity.txt
          archive="$RUNNER_TEMP/native-tooling/tooling.tar.gz"
          test "$(stat -c %s "$archive")" -le 335544320
          sha256sum "$archive" > "$RUNNER_TEMP/native-tooling/SHA256SUMS"
          split -d -b 20M "$archive" "$RUNNER_TEMP/native-tooling/part-"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-tooling-${{ github.sha }}-00
          path: ${{ runner.temp }}/native-tooling/part-00
          if-no-files-found: ignore
          retention-days: 2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-tooling-${{ github.sha }}-01
          path: ${{ runner.temp }}/native-tooling/part-01
          if-no-files-found: ignore
          retention-days: 2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-tooling-${{ github.sha }}-02
          path: ${{ runner.temp }}/native-tooling/part-02
          if-no-files-found: ignore
          retention-days: 2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
