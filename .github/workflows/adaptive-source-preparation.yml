name: Prepare checked source-only contribution

'on':
  push:
    branches: [codex/held-series-ci-20261019]
    paths:
      - '.github/adaptive-source-preparation/**'
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/adaptive-source-preparation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      RUSTUP_TOOLCHAIN: stable
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: >-
          rustup toolchain install stable --profile minimal
          --component rustfmt --component clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Verify isolated runner
        run: |
          if pgrep -x sashiko; then
            exit 1
          fi
          df -h .
      - name: Prepare and check source-only commits
        timeout-minutes: 35
        run: python3 .github/adaptive-source-preparation/run.py
      - name: Upload source preparation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adaptive-source-preparation-${{ github.sha }}
          path: adaptive-source-preparation/
          retention-days: 14
          if-no-files-found: error
