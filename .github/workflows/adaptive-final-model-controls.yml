name: Final-source model budget offline controls
'on':
  push:
    branches: [codex/held-series-ci-20261019]
    paths:
      - '.github/adaptive-final-model-review/run.py'
      - '.github/adaptive-final-model-review/selftest.py'
      - '.github/workflows/adaptive-final-model-controls.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check review harness metadata
        run: |
          python3 -m venv /tmp/adaptive-model-controls-lint
          /tmp/adaptive-model-controls-lint/bin/pip install yamllint==1.37.1
          export PATH="/tmp/adaptive-model-controls-lint/bin:$PATH"
          make check-pr RANGE=HEAD~1..HEAD
      - name: Offline budget and credential controls only
        run: python3 .github/adaptive-final-model-review/selftest.py
