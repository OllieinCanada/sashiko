name: Adaptive focused gap validation
'on':
  push:
    branches: [codex/held-series-ci-20261019]
    paths: ['src/**', '.github/workflows/adaptive-focused-gaps.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused-gaps:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      RUSTUP_TOOLCHAIN: stable
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal --component rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Capture formatting patch
        run: |
          cargo fmt --all
          git diff -- src > formatting.patch
          cat formatting.patch
      - name: Focused independent-connection and publication regressions
        run: |
          cargo test --locked --all-features --lib test_cooldown_same_message_concurrent_replay_preserves_owner -- --nocapture
          cargo test --locked --all-features --lib test_cooldown_failed_and_partial_reviews_are_not_clean -- --nocapture
          cargo test --locked --all-features --lib test_cooldown_held_queue_head_does_not_starve_eligible_work -- --nocapture
          cargo test --locked --all-features --lib test_cooldown_independent_publication_claims_have_one_winner -- --nocapture
      - name: Date trust and enabled release authorization
        run: |
          TZ=UTC cargo test --locked --all-features --bin sashiko test_cooldown_untrusted_dates_use_local_admission_time -- --nocapture
          TZ=America/New_York cargo test --locked --all-features --bin sashiko test_cooldown_untrusted_dates_use_local_admission_time -- --nocapture
          cargo test --locked --all-features --lib test_adaptive_release_patchset_embargo_authorization_and_endpoint -- --nocapture
      - name: Disabled and inherited configuration compatibility
        if: always()
        run: cargo test --locked --all-features --bin sashiko test_cooldown_disabled_configuration_preserves_fixed_embargo -- --nocapture
      - name: Offline review budget controls
        if: always()
        run: |
          python3 -m py_compile .github/adaptive-model-review/run.py .github/adaptive-model-review/selftest.py
          python3 .github/adaptive-model-review/selftest.py
      - name: Local CLI compatibility
        if: always()
        run: |
          cargo build --locked --no-default-features --bin sashiko
          target/debug/sashiko review --help
          set +e
          target/debug/sashiko --adaptive-cooldown-unknown-option
          cli_status=$?
          if [ "$cli_status" -ne 2 ]; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: adaptive-focused-format-${{ github.sha }}
          path: formatting.patch
