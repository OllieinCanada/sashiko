name: Adaptive focused gap validation
'on':
  push:
    branches: [codex/held-series-ci-20261019]
    paths: ['src/**', '.github/workflows/adaptive-focused-gaps.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused-gaps:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      RUSTUP_TOOLCHAIN: stable
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal --component rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Capture formatting patch
        run: |
          cargo fmt --all
          git diff -- src/db.rs src/db/cooldown.rs > formatting.patch
          cat formatting.patch
      - name: Focused independent-connection and publication regressions
        run: |
          cargo test --locked --all-features --lib test_cooldown_same_message_concurrent_replay_preserves_owner -- --nocapture
          cargo test --locked --all-features --lib test_cooldown_failed_and_partial_reviews_are_not_clean -- --nocapture
          cargo test --locked --all-features --lib test_cooldown_held_queue_head_does_not_starve_eligible_work -- --nocapture
          cargo test --locked --all-features --lib test_cooldown_independent_publication_claims_have_one_winner -- --nocapture
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: adaptive-focused-format-${{ github.sha }}
          path: formatting.patch
